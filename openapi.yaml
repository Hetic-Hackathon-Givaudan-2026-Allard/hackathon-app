openapi: 3.0.3
info:
  title: Contrat du service de recommandation Data
  version: 0.3.0
  description: >-
    Contrat convenu avec l’équipe Data pour GET /health et POST /ask. Le service FastAPI est
    développé dans un dépôt distinct ; ce dépôt fournit le frontend et une simulation Express locale.
    La région est un texte libre, sans liste de valeurs ni règles géographiques
    définies ici. Le code HTTP de la réponse d’erreur reste à confirmer avec Data. La simulation locale choisit 422 pour la validation, 413 pour un corps trop grand, 503 pour le scénario [erreur] et 500 pour une erreur interne ; ces choix ne définissent pas le contrat distant.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Vérifier que le service répond
      description: Vérifie que le service est joignable, sans garantir le succès d’une recommandation complète.
      responses:
        '200':
          description: Le service répond.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
  /ask:
    post:
      operationId: ask
      summary: Recommander un produit du catalogue à partir du brief et des préférences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            example:
              product_type: parfum
              brief: Le client recherche un parfum chaleureux et gourmand, avec une identité originale.
              preferences:
                gourmand: 8
                premium: 7
                naturel: 5
                audace: 9
                bien_etre: 6
              region: Europe
      responses:
        '200':
          description: Une recommandation ou aucune correspondance suffisante.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Success'
                  - $ref: '#/components/schemas/NoMatch'
                discriminator:
                  propertyName: status
                  mapping:
                    success: '#/components/schemas/Success'
                    no_match: '#/components/schemas/NoMatch'
              examples:
                success:
                  summary: Produit recommandé
                  value:
                    status: success
                    recommendation:
                      match_score: 85
                      product:
                        id: PARF-042
                        product_type: parfum
                        name: Bois gourmand
                        description: Un parfum aux notes gourmandes et boisées.
                      reasons:
                        - criterion: gourmand
                          explanation: Le profil gourmand documenté du produit correspond à la préférence élevée du client.
                        - criterion: brief
                          explanation: Les notes boisées correspondent à l’orientation chaleureuse demandée.
                      limitations:
                        - Le catalogue ne permet pas de confirmer la naturalité de la composition.
                no_match:
                  summary: Aucun produit suffisamment pertinent
                  value:
                    status: no_match
                    recommendation: null
                    message: Aucun produit suffisamment pertinent n’a été trouvé pour ces critères.
        default:
          description: >-
            Format d’erreur convenu avec Data. Les codes HTTP associés n’ont
            pas été précisés ; default décrit le corps sans leur attribuer
            un statut arbitraire. Ce format diffère des erreurs natives FastAPI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Certaines données sont invalides.
                  details:
                    - field: preferences.audace
                      message: La valeur doit être un entier compris entre 0 et 10.
components:
  schemas:
    ProductType:
      type: string
      enum: [parfum, arome]
    Preference:
      type: integer
      minimum: 0
      maximum: 10
    AskRequest:
      type: object
      required: [product_type, brief, preferences, region]
      properties:
        product_type:
          $ref: '#/components/schemas/ProductType'
        brief:
          type: string
          description: Brief du client. Aucune limite de longueur n’a été convenue.
        preferences:
          type: object
          required: [gourmand, premium, naturel, audace, bien_etre]
          properties:
            gourmand:
              $ref: '#/components/schemas/Preference'
            premium:
              $ref: '#/components/schemas/Preference'
            naturel:
              $ref: '#/components/schemas/Preference'
            audace:
              $ref: '#/components/schemas/Preference'
            bien_etre:
              $ref: '#/components/schemas/Preference'
        region:
          type: string
          description: Région transmise au service Data ; valeurs et interprétation à préciser.
          example: Europe
    Success:
      type: object
      required: [status, recommendation]
      properties:
        status:
          type: string
          enum: [success]
        recommendation:
          type: object
          required: [match_score, product, reasons, limitations]
          properties:
            match_score:
              type: integer
              minimum: 0
              maximum: 100
              description: Score de correspondance exprimé en pourcentage, pas une probabilité de satisfaction.
            product:
              type: object
              required: [id, product_type, name, description]
              properties:
                id:
                  type: string
                product_type:
                  $ref: '#/components/schemas/ProductType'
                name:
                  type: string
                description:
                  type: string
            reasons:
              type: array
              items:
                type: object
                required: [criterion, explanation]
                properties:
                  criterion:
                    type: string
                    description: Critère auquel se rapporte l’argument ; aucune liste fermée convenue.
                    example: gourmand
                  explanation:
                    type: string
            limitations:
              type: array
              items:
                type: string
    NoMatch:
      type: object
      required: [status, recommendation, message]
      properties:
        status:
          type: string
          enum: [no_match]
        recommendation:
          type: object
          nullable: true
          enum: [null]
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: VALIDATION_ERROR est le code fourni ; les autres codes ne sont pas définis ici.
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
